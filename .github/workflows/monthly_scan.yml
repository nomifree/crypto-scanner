name: Run Crypto Scanner

on:
  schedule:
    - cron: '17 0 * * 1'
    - cron: '17 0 1 * *'
  workflow_dispatch:

concurrency:
  group: crypto-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate code
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile scanner.py crypto_scanner/*.py
          pytest

      - name: Market data health check
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from crypto_scanner.market_data import fetch_auto_ohlc

          for symbol in ["GC=F"]:
              try:
                  df, source = fetch_auto_ohlc(symbol)
                  print(f"{symbol}: OK from {source}, rows={len(df)}, last={df.index[-1].date()}")
              except Exception as exc:
                  print(f"{symbol}: FAILED: {exc}")
          PY

      - name: Run scanner
        env:
          PYTHONPATH: .
          SCAN_MODE: crypto_pmex
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python scanner.py
